<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG - Chat com Manuais Técnicos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-3 px-6 shadow-md flex items-center justify-between z-10">
        <div class="flex items-center gap-2">
            <span class="text-xl">⚙️</span>
            <h1 class="text-base font-bold text-blue-400">RAG - Manuais de Automação (Chat Contínuo)</h1>
        </div>
        <button onclick="limparChat()" class="text-xs bg-slate-700 hover:bg-red-600 hover:text-white text-slate-300 px-3 py-1.5 rounded-lg transition-colors font-medium">
            🗑️ Limpar Conversa
        </button>
    </header>

    <!-- Chat Container (Rolável) -->
    <main id="chat-container" class="flex-grow overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-xl mx-auto w-full">
        <!-- Mensagem de Boas-Vindas Inicial -->
        <div class="flex items-start gap-3">
            <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm flex-shrink-0">AI</div>
            <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-4 max-w-2xl shadow-md text-slate-200 text-sm leading-relaxed">
                Olá! Sou seu assistente técnico especializado. Faça uma pergunta sobre os manuais (ex: <i>"Qual a tensão de alimentação do NDC?"</i>) e depois continue a conversa normalmente.
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input type="text" id="pergunta" placeholder="Digite sua dúvida ou continuação..." 
                class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-blue-500 transition-colors">
            <button onclick="enviarPergunta()" id="btn-enviar"
                class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl transition-colors flex items-center justify-center min-w-[120px] text-sm shadow-md">
                Enviar
            </button>
        </div>
    </footer>

    <!-- Script do Chat -->
    <script>
        const inputPergunta = document.getElementById('pergunta');
        const btnEnviar = document.getElementById('btn-enviar');
        const chatContainer = document.getElementById('chat-container');

        // Permitir envio com a tecla Enter
        inputPergunta.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                enviarPergunta();
            }
        });

        function rolarParaBaixo() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function enviarPergunta() {
            const pergunta = inputPergunta.value.trim();
            if (!pergunta) return;

            // Limpa o input
            inputPergunta.value = '';

            // Adiciona a mensagem do usuário no chat
            adicionarMensagem(pergunta, 'user');

            // Exibe indicador de carregamento ("Pensando...")
            const loadingId = adicionarCarregamento();
            rolarParaBaixo();

            // Desativa botões temporariamente
            btnEnviar.disabled = true;
            btnEnviar.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await fetch('/perguntar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pergunta })
                });

                const data = await response.json();

                // Remove o indicador de carregamento
                removerCarregamento(loadingId);

                // Adiciona a resposta do assistente com as fontes se houverem
                adicionarMensagemAssistente(data.resposta, data.fontes);

            } catch (error) {
                removerCarregamento(loadingId);
                adicionarMensagem("Erro de conexão com o servidor local.", 'assistant');
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.classList.remove('opacity-50', 'cursor-not-allowed');
                rolarParaBaixo();
            }
        }

        function adicionarMensagem(texto, remetente) {
            const div = document.createElement('div');
            if (remetente === 'user') {
                div.className = "flex items-start gap-3 justify-end";
                div.innerHTML = `
                    <div class="bg-blue-600 border border-blue-500 rounded-2xl rounded-tr-none p-4 max-w-2xl shadow-md text-slate-100 text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(texto)}</div>
                    <div class="bg-slate-700 text-slate-300 rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm flex-shrink-0">EU</div>
                `;
            }
            chatContainer.appendChild(div);
            rolarParaBaixo();
        }

        function adicionarMensagemAssistente(resposta, fontes) {
            const div = document.createElement('div');
            div.className = "flex items-start gap-3";
            
            let htmlFontes = '';
            if (fontes && fontes.length > 0) {
                htmlFontes = `
                    <div class="mt-3 pt-3 border-t border-slate-700 text-xs text-blue-300">
                        <span class="font-semibold uppercase tracking-wider text-slate-400 block mb-1">Manuais Consultados:</span>
                        <ul class="space-y-0.5">
                            ${fontes.map(f => `<li>• ${escapeHtml(f)}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm flex-shrink-0">AI</div>
                <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-4 max-w-2xl shadow-md text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(resposta)}${htmlFontes}</div>
            `;
            chatContainer.appendChild(div);
            rolarParaBaixo();
        }

        function adicionarCarregamento() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = "flex items-start gap-3";
            div.innerHTML = `
                <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm flex-shrink-0">AI</div>
                <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-4 shadow-md text-slate-400 text-sm flex items-center gap-2">
                    <svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Analisando manuais e conversando...</span>
                </div>
            `;
            chatContainer.appendChild(div);
            return id;
        }

        function removerCarregamento(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        async function limparChat() {
            await fetch('/limpar', { method: 'POST' });
            chatContainer.innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm flex-shrink-0">AI</div>
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-4 max-w-2xl shadow-md text-slate-200 text-sm leading-relaxed">
                        Conversa limpa! Pode fazer sua nova pergunta técnica.
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
